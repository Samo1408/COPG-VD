name: Build LSPosed Module

on:
  push:
    branches: [lspd]
    paths:
      - 'lsposed_module/**'
      - '.github/workflows/build-lsposed.yml'
  pull_request:
    branches: [lspd]
    paths:
      - 'lsposed_module/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lsposed_module

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lsposed_module/**/*.gradle*', 'lsposed_module/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          shopt -s dotglob
          mv $HOME/android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/ 2>/dev/null || true
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant gradlew
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build LSPosed APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle wrapper
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -path "*/release/*" | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: COPGVD-LSPosed
          path: lsposed_module/app/build/outputs/apk/release/*.apk

      - name: Summary
        if: always()
        run: |
          {
            echo "### COPG-VD LSPosed Build"
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| branch | \`${{ github.ref_name }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| apk | \`${{ steps.apk.outputs.apk_path }}\` |"
          } >> $GITHUB_STEP_SUMMARY
